name: CI

# Runs on every push (any branch) and every PR. The `build` job is the merge
# gate: make it a required status check in branch protection for `main`. The
# actual checks live in scripts/ci.sh (single source of truth, runnable locally).
on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: this workflow only checks out + builds; no writes needed.
permissions:
  contents: read

defaults:
  run:
    shell: bash # so scripts/ci.sh runs on the Windows runner too

jobs:
  build:
    name: build · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # macOS is contributor-led (the author has no mac hardware): visible but
    # non-blocking, so a mac-only break never gates a merge.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: true

      - run: zig version

      # fmt + build + run demo + module test. `.gitattributes` (eol=lf) keeps
      # the Windows checkout LF so the fmt gate passes there too.
      - name: CI checks
        run: bash scripts/ci.sh
